                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookingPassenger'
        '400':
          $ref: '#/components/responses/BookingValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Booking or passenger not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/bookings/{bookingId}/passengers/{passengerId}/addons:
    patch:
      summary: Update passenger add-ons on one leg
      description: >
        Updates optional add-ons for the passenger on the leg identified by `legId`.
        Recalculates that leg's `passengerFare`, booking `fareBreakdown`, and `totalAmount`.
        At least one add-on field (besides `legId`) must be present.
        Set `extraBaggage` or `meal` to `null` to remove.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/BookingPassengerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookingAddonsRequest'
