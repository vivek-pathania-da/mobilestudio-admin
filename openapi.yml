  /v1/dashboard/metrics:
    get:
      summary: Dashboard metrics (admin)
      description: >
        Returns aggregated customer, theme, and user statistics plus recent customers.
        Requires a JWT with role `admin`. Responses are cached in the Lambda container
        for 5 minutes (`cachedUntil` in the payload); subsequent calls within that window
        return the cached snapshot.
      tags: [Dashboard]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard metrics snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardMetrics'
              example:
                success: true
                data:
                  customers:
                    total: 12
                    active: 8
                    trial: 2
                    suspended: 1
                    churned: 1
                  themes:
                    total: 18
                    withActiveTheme: 10
                    customersWithNoActiveTheme:
                      - customerId: a1b2c3d4-e5f6-4789-a012-3456789abcde
                        customerCode: AIRXYZ
                        companyName: Air XYZ Ltd
                        status: active
                  users:
                    admins: 3
                    regularUsers: 844
                    customers: 0
                    total: 847
                  recentCustomers:
                    - customerId: a1b2c3d4-e5f6-4789-a012-3456789abcde
                      customerCode: AIRXYZ
                      companyName: Air XYZ Ltd
                      industry: aviation
                      status: active
                      createdAt: '2026-05-14T07:27:46.941Z'
                  generatedAt: '2026-05-15T09:00:00.000Z'
                  cachedUntil: '2026-05-15T09:05:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
