  /v1/bookings:
    post:
      summary: Create a new multi-leg booking
      description: >
        Supports 1–4 flight legs per booking (outbound, connecting, return). Each leg references
        a per-segment `flightId` in `FlightOffers` (use `segmentFlightIds` from search for
        connecting cards — not the parent BLR→SIN id on every leg). For connecting itineraries,
        include `segment` on each leg with that leg's airports and local times from search
        `segments[]` so stored snapshots show BLR→MAA and MAA→SIN instead of the full route on
        every leg. Passengers provide per-leg seat and add-on assignments via `legOrder` (0-based);
        the server assigns `legId` UUIDs. `cabinClass` applies to the entire booking.
      tags: [Bookings]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
            examples:
              singleLeg:
                summary: One leg, one passenger
                value:
                  legs:
                    - flightId: 55555555-5555-4555-8555-555555555555
                      fareClassCode: LITE
                      departureDate: '2026-08-15'
                  cabinClass: 1
                  contactEmail: john.doe@example.com
                  contactPhone: '+44123456789'
                  passengers:
                    - type: adult
                      title: Mr
                      firstName: John
                      lastName: Doe
                      dateOfBirth: '1990-01-15'
                      nationality: GB
                      passportNumber: AB123456
                      passportExpiry: '2030-12-31'
                      legs:
                        - legOrder: 0
                          seatNumber: 14A
                          seatSelection:
                            category: paid_35
                            seatType: window
                            price: 35
                          addons:
                            baggage:
                              extraType: extra_bag_10kg
                              label: '+10 kg'
                              weightKg: 10
                              price: 55
                            mealSelection:
                              meal: vegetarian
                              mealCode: VGML
                              mealName: Vegetarian Meal
                              price: 0
                  tripProtection:
                    planId: trip_protection_basic
                    planName: Trip Protection
                    price: 34
                    coverageAmount: 10000
                    coverageCurrency: USD
              multiLeg:
                summary: Two legs, two passengers
                value:
                  legs:
                    - flightId: 55555555-5555-4555-8555-555555555555
                      fareClassCode: LITE
                      departureDate: '2026-08-15'
                    - flightId: 77777777-7777-4777-8777-777777777777
                      fareClassCode: FLEX
                      departureDate: '2026-08-20'
                  cabinClass: 1
                  contactEmail: family@example.com
                  contactPhone: '+919876543210'
                  passengers:
                    - type: adult
                      title: Mr
                      firstName: Raj
                      lastName: Sharma
                      dateOfBirth: '1985-06-20'
                      nationality: IN
                      passportNumber: Z1234567
                      passportExpiry: '2031-03-15'
                      legs:
                        - legOrder: 0
                          seatNumber: 12A
                        - legOrder: 1
                          seatNumber: 8C
                    - type: adult
                      title: Mrs
                      firstName: Priya
                      lastName: Sharma
                      dateOfBirth: '1987-11-02'
                      nationality: IN
                      passportNumber: Z7654321
                      passportExpiry: '2031-03-15'
                      legs:
                        - legOrder: 0
                          seatNumber: 12B
                        - legOrder: 1
                          seatNumber: 8D
              connectingFlight:
                summary: AI238 BLR→SIN via MAA (two segment flightIds + segment times)
                value:
                  legs:
                    - flightId: a1a1a1a1-a1a1-4a1a-8a1a-a1a1a1a1a1a1
                      fareClassCode: VALUE
                      departureDate: '2026-05-22'
                      segment:
                        fromAirportCode: BLR
                        toAirportCode: MAA
                        fromAirportName: Bengaluru
                        toAirportName: Chennai
                        departureTimeLocal: '07:00'
                        arrivalTimeLocal: '08:30'
                    - flightId: a2a2a2a2-a2a2-4a2a-8a2a-a2a2a2a2a2a2
                      fareClassCode: VALUE
                      departureDate: '2026-05-22'
                      segment:
                        fromAirportCode: MAA
                        toAirportCode: SIN
                        fromAirportName: Chennai
                        toAirportName: Singapore Changi
                        departureTimeLocal: '09:40'
                        arrivalTimeLocal: '15:30'
                  cabinClass: 1
                  contactEmail: yogesh@example.com
                  contactPhone: '+919876543210'
                  passengers:
                    - type: adult
                      title: Mr
                      firstName: Yogesh
                      lastName: Tanwar
                      dateOfBirth: '1990-01-15'
                      nationality: IN
                      passportNumber: P1234567
                      passportExpiry: '2030-01-15'
                      legs:
                        - legOrder: 0
                          seatNumber: 5G
                        - legOrder: 1
                          seatNumber: 4E
      responses:
        '201':
          description: Booking created with passengers and per-leg assignments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookingWithPassengers'
        '400':
          $ref: '#/components/responses/BookingValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Flight not found in FlightOffers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: 'Flight not found for flightId: 00000000-0000-4000-8000-000000000000'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/bookings/upcoming:
    get:
      summary: List upcoming bookings
      description: >
        Returns bookings where the **latest leg** has not yet departed (trip still in the future).
        Multi-leg trips remain here until the final leg departs. Sorted by earliest leg departure
        ascending (soonest first). Each item includes the `legs` array without passenger detail.
        Optional `status` query filter matches `Booking.status`.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingStatusFilter'
      responses:
        '200':
          description: List of upcoming bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/bookings/past:
    get:
      summary: List past bookings
      description: >
        Returns bookings where the **latest leg** has already departed (trip is over).
        Sorted by latest leg departure descending (most recent first). Each item includes the
        `legs` array without passenger detail. Optional `status` query filter matches `Booking.status`.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingStatusFilter'
      responses:
        '200':
          description: List of past bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/bookings/reference/{bookingReference}:
