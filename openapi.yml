  /v1/bookings/{bookingId}:
    get:
      summary: Get booking by id
      description: Returns full booking with all passengers. Ownership enforced.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
