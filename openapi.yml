          description: Updated passenger and booking total
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UpdateBookingAddonsResult'
        '400':
          $ref: '#/components/responses/BookingValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
