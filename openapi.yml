  /v1/bookings/{bookingId}/change-flight:
    post:
      summary: Change one leg to a different flight
      description: >
        Switches a single leg (`legId`) to a new flight with the same origin and destination.
        Recalculates fares for that leg, resets check-in state, clears boarding passes on the
        changed leg only, and appends a `changeHistory` entry. Not allowed after check-in is complete.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeBookingFlightRequest'
      responses:
        '200':
          description: Updated booking with fare difference
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChangeBookingFlightResult'
        '400':
          $ref: '#/components/responses/BookingValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Booking or new flight not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/bookings/{bookingId}/check-in:
    post:
      summary: Check in all passengers for all legs
      description: >
        Check-in window is based on the **earliest** leg departure (opens 48h before, closes 1h before).
        For each passenger on each leg: generates boarding pass data (group, gate, barcode with `legOrder`),
        creates a PDF at `boarding-passes/{bookingId}/{passengerId}/leg-{legOrder}.pdf` (S3),
        and returns a pre-signed `pdfUrl` (24h expiry) on each leg assignment.
        Sets booking `checkInStatus` to `completed` and `status` to `checked_in`.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Checked-in booking with boarding passes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookingWithPassengers'
        '400':
          description: >
            Check-in window closed, already checked in, or not yet open.
            When not yet open, response may include `hoursUntilOpen`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/CheckInNotOpenError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/bookings/{bookingId}/boarding-passes:
    get:
      summary: Get boarding passes with fresh PDF URLs
      description: >
        Returns all passengers with per-leg boarding pass data. Re-generates pre-signed S3 URLs from each
        leg assignment's stored `s3Key` (original URLs expire after 24 hours). Booking must be checked in.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Passengers with boarding passes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BoardingPassesResult'
        '400':
          $ref: '#/components/responses/BookingValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

