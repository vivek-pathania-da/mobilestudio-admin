# MobileStudio API — OpenAPI 3.0.1
# Generated: April 2026
# Base URL (dev): https://3jt1es1dae.execute-api.ap-south-1.amazonaws.com/dev
# To view: paste into https://editor.swagger.io
openapi: 3.0.1
info:
  title: MobileStudio API
  version: 1.0.0
  description: Authentication API for MobileStudio. All endpoints are under /v1.
  x-internal-notes:
    tokenStorageGuidance:
      - "Access token: store in memory only (JavaScript variable). Do NOT store in localStorage or sessionStorage - vulnerable to XSS."
      - "Refresh token: store in an HttpOnly cookie (web) or iOS Keychain / Android Keystore (mobile)."
      - "userId: can be stored in localStorage (not sensitive)."
    tokenRefreshFlow:
      - "1. Make API call with access token in Authorization header"
      - "2. If response is 401, call POST /v1/auth/refresh with refreshToken + userId"
      - "3. Store the NEW accessToken and NEW refreshToken from the refresh response"
      - "4. Retry the original API call with the new access token"
      - "5. If /auth/refresh also returns 401, the session has expired - redirect to login"
    passwordResetFlow:
      - "1. User submits email to POST /v1/auth/forgot-password"
      - "2. User receives email with link: https://yourapp.com/reset-password?token=UUID"
      - "3. Frontend extracts the token from the URL query parameter"
      - "4. Frontend shows a new password form"
      - "5. On submit, call POST /v1/auth/reset-password with { resetToken, newPassword }"
      - "6. On success, redirect to login"
    cors:
      - "All endpoints accept requests from any origin in dev."
      - "In prod, only requests from the registered frontend domain are accepted."
      - "Preflight OPTIONS requests are handled automatically by API Gateway."
servers:
  - url: https://3jt1es1dae.execute-api.ap-south-1.amazonaws.com/dev
    description: Development server
  - url: https://YOUR_PROD_URL/prod
    description: Production server (replace before go-live)
tags:
  - name: Auth
    description: Authentication endpoints
  - name: Admin
    description: Admin-only operations (requires JWT with role admin)
  - name: Dashboard
    description: >
      Admin dashboard aggregates (customer/theme/user counts, recent customers).
      Responses are cached in Lambda memory for 5 minutes per warm container.
  - name: Customers
    description: >
      Tenant registry (admin only). Each customer has a UUID `customerId` (primary key) and a unique
      human-readable `customerCode` (e.g. AIRXYZ). Use **`customerId` (UUID)** as `{customerId}` in `/v1/themes/{customerId}`.
      Supports `GET ?status=`, soft delete (churn), and `PATCH` to change `customerCode` only (themes stay under the same UUID).
  - name: Common
    description: Common shared endpoints
  - name: Flights
    description: Flight search and pricing endpoints
  - name: Cart
    description: >
      Shopping cart for authenticated users — legs, passengers, and add-ons.
      All routes require a Bearer access token. Cart TTL and totals are enforced server-side.
  - name: Theme
    description: >
      Per-customer theme overrides and activation. GET active theme is public; all other theme
      routes require a JWT with role admin. AI theme generation (Bedrock) returns a full token map
      without persisting to DynamoDB.
paths:
  /v1/auth/signup:
    post:
      summary: Register a new user account
      description: >
        Creates a new user with role "user". Does not return tokens.
        The user must call /auth/login after signup to obtain tokens.
        Admins cannot be created via this endpoint.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SignupData'
        '400':
          description: Validation error - invalid email format, weak password, or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                weakPassword:
                  value:
                    success: false
                    message: Password must be at least 8 characters with one uppercase letter and one number
                invalidEmail:
                  value:
                    success: false
                    message: Invalid email format
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Email already registered
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/login:
    post:
      summary: Authenticate and obtain tokens
      description: >
        Validates credentials and returns an access token (15 min) and a refresh token (7 days).
        The refresh token is opaque (UUID) - store it securely alongside the userId.
        Both are required to call /auth/refresh.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '401':
          description: Invalid credentials
          x-note-for-frontend-dev: >
            This is returned for both "email not found" and "wrong password".
            The API intentionally does not distinguish between the two.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Invalid email or password
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/forgot-password:
    post:
      summary: Request a password reset email
      description: >
        Sends a password reset link to the provided email address if it exists.
        Always returns 200 regardless of whether the email exists - this is intentional
        to prevent email enumeration attacks. Do not show the user different messages
        based on whether they received an email.
        The reset token in the link is valid for 30 minutes.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request processed (email sent if address exists)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ForgotPasswordData'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/reset-password:
    post:
      summary: Reset password using token from email
      description: >
        Resets the user's password using the token received in the forgot-password email.
        The token is extracted from the reset link query parameter (?token=...).
        After a successful reset:
          - The reset token is invalidated (single use)
          - All existing refresh tokens for the user are revoked (all sessions logged out)
          - The user must login again to get new tokens
        Token expires after 30 minutes.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ResetPasswordData'
        '400':
          description: Weak password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token invalid, already used, or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Invalid or expired reset token
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/refresh:
    post:
      summary: Obtain a new access token using a refresh token
      description: >
        Issues a new access token and rotates the refresh token.
        IMPORTANT - refresh token rotation:
          - The old refresh token is invalidated immediately after this call
          - The response contains a NEW refresh token
          - Always replace your stored refresh token with the new one
          - If you call refresh twice with the same token, the second call will return 401
        Call this endpoint when the access token expires (after 15 minutes).
        You must send BOTH the refreshToken and the userId from the original login response.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RefreshResult'
        '401':
          description: Refresh token invalid, expired, or already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Invalid refresh token
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/bootstrap-admin:
    post:
      summary: Create first admin or promote existing user (bootstrap secret)
      description: >
        Public endpoint gated by a deploy-time secret (`ADMIN_BOOTSTRAP_SECRET = adminsecret` / CDK context
        `adminBootstrapSecret`). If the secret is not configured, returns 403.
        With `password` + `name`: registers a new user with admin role.
        With only `email` (no password): promotes an existing user to admin.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapAdminRequest'
      responses:
        '200':
          description: Existing user promoted to admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BootstrapAdminResult'
        '201':
          description: New admin user created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BootstrapAdminResult'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Secret missing, wrong, or bootstrap disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found (promote mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered (create mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/auth/logout:
    post:
      summary: Revoke all sessions for the current user
      description: >
        Invalidates all refresh tokens for the authenticated user.
        The access token will continue to work until it expires naturally (max 15 minutes).
        To fully secure logout on the client side, also clear the access token from memory.
        Requires a valid access token in the Authorization header.
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LogoutData'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/common/search:
    get:
      summary: Live search for airlines or airports
      description: >
        Performs authenticated live search against airline or airport master data.
        Required query param:
          - type: airline or airport
        Optional query param:
          - query: search text
        If query is provided, matching is case-insensitive prefix-based across name and code fields
        and up to 20 search results are returned.
        If query is omitted or empty, search_results is empty and favourites are still returned.
      tags: [Common]
      security:
        - BearerAuth: []
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            minLength: 1
          description: Optional search text used for live matching.
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/SearchType'
          description: Decides which table is searched.
      responses:
        '200':
          description: Search results returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SearchResponseData'
        '400':
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidType:
                  value:
                    success: false
                    message: "Invalid type. Allowed values: airline, airport"
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/common/populate:
    post:
      summary: Populate airlines or airports master table
      description: >
        Authenticated bulk upsert-style insert endpoint for master data population.
        Uses request type to decide destination table:
          - airline -> Airlines table
          - airport -> Airports table
        Each request can include up to 500 items.
      tags: [Common]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PopulateRequest'
      responses:
        '200':
          description: Records inserted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PopulateResult'
        '400':
          description: Validation error for payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBody:
                  value:
                    success: false
                    message: Request body is required
                invalidType:
                  value:
                    success: false
                    message: "Invalid type. Allowed values: airline, airport"
                invalidItems:
                  value:
                    success: false
                    message: Each item must include name, code, and country
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/common/favourite:
    post:
      summary: Mark or unmark favourite entity for current user
      description: >
        Authenticated user-level favourite toggle endpoint.
        Uses type + uid to identify an entity.
        - isFavourite=true: mark as favourite (upsert)
        - isFavourite=false: unmark favourite (delete)
        Supports both airline and airport types.
      tags: [Common]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavouriteToggleRequest'
      responses:
        '200':
          description: Favourite state updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FavouriteToggleResult'
        '400':
          description: Validation error in payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBody:
                  value:
                    success: false
                    message: Request body is required
                invalidType:
                  value:
                    success: false
                    message: "Invalid type. Allowed values: airline, airport"
                missingUid:
                  value:
                    success: false
                    message: uid is required
                invalidFlag:
                  value:
                    success: false
                    message: isFavourite must be a boolean
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/customers:
    get:
      summary: List customers (tenants)
      description: Newest first. Omit `status` to return active and churned customers.
      tags: [Customers]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, churned]
          description: When set, only customers with that status are returned.
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid query (e.g. unknown status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a customer (tenant)
      description: >
        Creates a new customer with a generated UUID `customerId` and a unique `customerCode`.
        Custom `customerCode` (if sent) must be 2–10 uppercase letters/digits after normalization; if omitted, a base
        code is derived from `companyName` (common suffixes stripped). Auto-resolved collisions use a numeric suffix
        (e.g. AIRXYZ, AIRXYZ2); stored codes may be up to 15 characters.
      tags: [Customers]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Could not allocate a unique customer code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerTenantId'
    get:
      summary: Get customer by id
      description: Returns the customer record. `customerId` in the path is the UUID primary key.
      tags: [Customers]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Customer record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid customerId (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update customer
      description: >
        Partial update: any combination of `customerCode`, `companyName`, `industry`, `primaryEmail`, `contactName`,
        and `status` (`active` or `churned`). At least one field is required. `customerId` (UUID) never changes.
        Churned customers can only be updated when reactivating with `"status": "active"` (other fields may be
        included in the same request). Setting `status` to `churned` is equivalent to soft-delete semantics.
      tags: [Customers]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '400':
          description: >
            Validation error (e.g. invalid customerId, empty body, churned customer without reactivation,
            invalid field values)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: customerCode already used by another customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Soft-delete customer (churn)
      description: Sets status to `churned`. Repeat delete returns 400.
      tags: [Customers]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Customer churned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '400':
          description: Already churned, or invalid customerId (not a UUID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/admin/users/{userId}/role:
    patch:
      summary: Set a user's global role (admin or user)
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [userId, role]
                        properties:
                          userId:
                            type: string
                            format: uuid
                          role:
                            $ref: '#/components/schemas/UserRole'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/dashboard/metrics:
    get:
      summary: Dashboard metrics (admin)
      description: >
        Returns aggregated customer, theme, and user statistics plus recent customers.
        Requires a JWT with role `admin`. Responses are cached in the Lambda container
        for 5 minutes (`cachedUntil` in the payload); subsequent calls within that window
        return the cached snapshot.
      tags: [Dashboard]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Dashboard metrics snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DashboardMetrics'
              example:
                success: true
                data:
                  customers:
                    total: 12
                    active: 8
                    trial: 2
                    suspended: 1
                    churned: 1
                  themes:
                    total: 18
                    withActiveTheme: 10
                    customersWithNoActiveTheme:
                      - customerId: a1b2c3d4-e5f6-4789-a012-3456789abcde
                        customerCode: AIRXYZ
                        companyName: Air XYZ Ltd
                        status: active
                  users:
                    admins: 3
                    regularUsers: 844
                    customers: 0
                    total: 847
                  recentCustomers:
                    - customerId: a1b2c3d4-e5f6-4789-a012-3456789abcde
                      customerCode: AIRXYZ
                      companyName: Air XYZ Ltd
                      industry: aviation
                      status: active
                      createdAt: '2026-05-14T07:27:46.941Z'
                  generatedAt: '2026-05-15T09:00:00.000Z'
                  cachedUntil: '2026-05-15T09:05:00.000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Forbidden
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/flights/search:
    post:
      summary: Search flights (outbound or inbound leg)
      description: >
        Returns card-ready flight offers for the requested route/date.
        Round-trip behavior is handled by calling this endpoint twice:
        first for outbound, then again for inbound with swapped airports and updated date.
        No multicity support in v1.
      tags: [Flights]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightSearchRequest'
      responses:
        '200':
          description: Flight offers returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FlightSearchResponseData'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingRequiredFields:
                  value:
                    success: false
                    message: fromAirportCode, toAirportCode and departureDate are required
                sameRoute:
                  value:
                    success: false
                    message: fromAirportCode and toAirportCode cannot be the same
                invalidDate:
                  value:
                    success: false
                    message: departureDate must be in YYYY-MM-DD format
                invalidCabinClass:
                  value:
                    success: false
                    message: Invalid cabinClass enum value
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/flights/fares:
    get:
      summary: Fetch fare options for a selected flight
      description: >
        Returns fare options (for example Standard/Flex/Premium) for a given flight card.
      tags: [Flights]
      security:
        - BearerAuth: []
      parameters:
        - name: flightId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Fare options returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FlightFareOptionsResponseData'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFlightId:
                  value:
                    success: false
                    message: flightId is required
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/flights/{flightId}/seatmap:
    get:
      summary: Fetch seat map for a flight
      description: >
        Returns a demo seat map. The path `flightId` is echoed back as-is (for example the DynamoDB offer UUID);
        layout, route, currency, and taken seats are randomized per request and are not loaded from the database.
      tags: [Flights]
      security:
        - BearerAuth: []
      parameters:
        - name: flightId
          in: path
          required: true
          schema:
            type: string
          description: >
            Opaque flight identifier from your app (for example UUID from flight search). Echoed in the response;
            not used to resolve stored seat data in this version.
      responses:
        '200':
          description: Seat map returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SeatmapResponseData'
        '404':
          description: Flight or aircraft config not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFlightId:
                  value:
                    success: false
                    message: flightId is required
                flightNotFound:
                  value:
                    success: false
                    message: Flight not found
                aircraftNotFound:
                  value:
                    success: false
                    message: Aircraft configuration not found
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/flights/populate:
    post:
      summary: Populate flight tables from request payload
      description: >
        Inserts linked flight offers, fare options, and extras in bulk.
        Validates that fareOptions.flightId and extras.flightId exist in offers.
      tags: [Flights]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightPopulateRequest'
      responses:
        '200':
          description: Flight data inserted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FlightPopulateResponseData'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBody:
                  value:
                    success: false
                    message: Request body is required
                missingOffers:
                  value:
                    success: false
                    message: offers must contain at least one item
                invalidOfferFlightId:
                  value:
                    success: false
                    message: Each offer must include flightId
                fareLinkMismatch:
                  value:
                    success: false
                    message: Each fareOption.flightId must reference an existing offer flightId
                extraLinkMismatch:
                  value:
                    success: false
                    message: Each extra.flightId must reference an existing offer flightId
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/flights/addons/catalog:
    post:
      summary: Add-ons catalog for one or more flight legs
      description: >
        Returns an add-ons catalog keyed by each flightId (offer UUID from flight search / populate).
        For each leg, segment (airports, departure date, departureEpoch), currency, and included baggage
        summary are read from the FlightOffers table. Add-on line items (baggage upsell, trip protection, meals)
        remain demo content for this version.
      tags: [Flights]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlightAddonsCatalogRequest'
      responses:
        '200':
          description: Catalog per flightId
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FlightAddonsCatalogResponseData'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBody:
                  value:
                    success: false
                    message: Request body is required
                emptyFlightIds:
                  value:
                    success: false
                    message: flightIds must be a non-empty array
                tooManyLegs:
                  value:
                    success: false
                    message: A maximum of 10 flightIds is allowed per request
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '404':
          description: Unknown flightId (no offer row in FlightOffers)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Flight offer not found for flightId: 00000000-0000-4000-8000-000000000000"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/carts:
    post:
      summary: Create a new cart
      description: >
        Creates a cart with 1–2 legs and at least one passenger. Leg `flightId` is resolved to
        origin/destination when known (see seatmap flight config); otherwise airports are `UNKNOWN`.
        `totalAmount` is computed from leg fares × passenger count plus any add-ons (initially legs only).
      tags: [Cart]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCartRequest'
      responses:
        '201':
          description: Cart created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartDetailResponseData'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List carts for the current user
      description: >
        Returns carts for the authenticated user. Active carts are listed first (soonest expiry first);
        other statuses follow (newest first). Carts that are still `active` in the database but past
        `expiresAt` are shown with status `expired` in this list (read-only enrichment; TTL may remove rows later).
      tags: [Cart]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of cart summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CartListItem'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/carts/{cartId}:
    get:
      summary: Get cart detail
      description: >
        Returns full cart, legs, passengers, and add-ons. Ownership is required. Expired or non-active
        carts may still be returned for display (no 410 on read); mutating endpoints enforce expiry and status.
      tags: [Cart]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Cart detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CartDetailResponseData'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '403':
          description: Cart belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Forbidden
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Abandon cart
      description: Sets cart status to `abandoned`. Requires an active, non-expired cart owned by the user.
      tags: [Cart]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Cart marked abandoned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: Cart abandoned
                        required: [message]
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Cart expired or not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/carts/{cartId}/legs/{legId}:
