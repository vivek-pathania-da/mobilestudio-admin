        - companyName
        - industry
        - primaryEmail
        - contactName
        - status
        - createdByUserId
        - createdAt
        - updatedAt
      properties:
        customerId:
          type: string
          format: uuid
          description: DynamoDB partition key (UUID v4). Use this value in `/v1/themes/{customerId}`.
          example: a1b2c3d4-e5f6-4789-a012-3456789abcde
        customerCode:
          type: string
          description: Unique human-readable tenant slug (2–15 uppercase A–Z / 0–9 when suffixed).
          example: AIRXYZ
        companyName:
          type: string
        industry:
          type: string
        primaryEmail:
          type: string
          format: email
        contactName:
          type: string
        status:
          type: string
          enum: [active, churned]
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DashboardMetricsCustomerCounts:
      type: object
      required: [total, active, trial, suspended, churned]
      properties:
        total:
          type: integer
          minimum: 0
          description: Sum of customers across all statuses.
        active:
          type: integer
          minimum: 0
        trial:
          type: integer
          minimum: 0
        suspended:
          type: integer
          minimum: 0
        churned:
          type: integer
          minimum: 0

    DashboardCustomerWithoutActiveTheme:
      type: object
      required: [customerId, customerCode, companyName, status]
      properties:
        customerId:
          type: string
          format: uuid
        customerCode:
          type: string
          example: AIRXYZ
        companyName:
          type: string
        status:
          type: string
          description: Always `active` — only active customers are flagged when missing a theme.

    DashboardRecentCustomer:
      type: object
      required:
        - customerId
        - customerCode
        - companyName
        - industry
        - status
        - createdAt
      properties:
        customerId:
          type: string
          format: uuid
        customerCode:
          type: string
        companyName:
          type: string
        industry:
          type: string
        status:
          type: string
          enum: [active, trial, suspended, churned]
        createdAt:
          type: string
          format: date-time

    DashboardMetricsThemeCounts:
      type: object
      required: [total, withActiveTheme, customersWithNoActiveTheme]
      properties:
        total:
          type: integer
          minimum: 0
          description: Total theme records across all customers.
        withActiveTheme:
          type: integer
          minimum: 0
          description: Count of customers that have at least one active theme.
        customersWithNoActiveTheme:
          type: array
          items:
            $ref: '#/components/schemas/DashboardCustomerWithoutActiveTheme'

    DashboardMetricsUserCounts:
      type: object
      required: [admins, regularUsers, customers, total]
      properties:
        admins:
          type: integer
          minimum: 0
          description: Users with global role `admin` (UserRoles RoleIndex).
        regularUsers:
          type: integer
          minimum: 0
          description: Users with global role `user`.
        customers:
          type: integer
          minimum: 0
          description: Users with global role `customer` (reserved for future tenant users).
        total:
          type: integer
          minimum: 0
          description: Sum of admins, regularUsers, and customers.

    DashboardMetrics:
      type: object
      required:
        - customers
        - themes
        - users
        - recentCustomers
        - generatedAt
        - cachedUntil
      properties:
        customers:
          $ref: '#/components/schemas/DashboardMetricsCustomerCounts'
        themes:
          $ref: '#/components/schemas/DashboardMetricsThemeCounts'
        users:
          $ref: '#/components/schemas/DashboardMetricsUserCounts'
        recentCustomers:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DashboardRecentCustomer'
        generatedAt:
          type: string
          format: date-time
          description: When this snapshot was computed.
        cachedUntil:
          type: string
          format: date-time
          description: >
            Warm-container cache expiry. Identical responses may be returned until this time.

    CreateCustomerRequest:
      type: object
      required: [companyName, industry, primaryEmail, contactName]
      example:
        companyName: Air XYZ Ltd
        industry: aviation
        primaryEmail: ops@airxyz.com
        contactName: John Smith
      properties:
        companyName:
          type: string
          minLength: 1
          maxLength: 200
        industry:
          type: string
          minLength: 1
          maxLength: 60
        primaryEmail:
          type: string
          format: email
        contactName:
          type: string
          minLength: 1
          maxLength: 200
        customerCode:
          type: string
          minLength: 1
          maxLength: 10
          description: >
            Optional. Letters and digits (normalized to uppercase A–Z, 0–9). Must be 2–10 characters after normalization.
            If omitted, derived from companyName. If taken, the next free code is allocated.

    UpdateCustomerRequest:
      type: object
      minProperties: 1
      description: Partial update — include at least one property.
      properties:
        customerCode:
          type: string
          minLength: 1
          maxLength: 10
          description: >
            Normalized to uppercase A–Z and digits; 2–10 characters. Must remain unique across customers (409 if taken).
        companyName:
          type: string
          minLength: 1
          maxLength: 200
        industry:
          type: string
          minLength: 1
          maxLength: 60
        primaryEmail:
          type: string
          format: email
        contactName:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum: [active, churned]
          description: Set to churned to mark inactive, or active to reactivate a churned customer.

    UpdateUserRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'

    AiGenerateThemeRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 5
          maxLength: 500
          description: Natural-language brand or style brief for the colour palette.
        customerId:
          type: string
          format: uuid
          description: Optional tenant id for server logs only; no data is stored.
        themeMode:
          type: string
          enum: [light, dark]
          description: >
            Optional. Forces light or dark theme mode. When omitted, Claude infers mode from the prompt.
        primaryColours:
          type: array
          minItems: 1
          maxItems: 3
          description: >
            Optional. 1–3 brand hex colours (#RRGGBB) to lock before generation.
            1 colour locks primary (primaryLight/primaryDark are derived server-side).
            2 colours lock primary and secondary. 3 colours lock primary, secondary, and accent.
            Takes precedence over `image` when both are provided.
          items:
            type: string
            pattern: '^#[0-9A-Fa-f]{6}$'
            example: '#1E3A5F'
        image:
          type: string
          minLength: 1
          maxLength: 7000000
          description: >
            Optional. Base64-encoded image (logo, brand guidelines, mood board, or UI screenshot).
            Claude extracts dominant brand colours when `primaryColours` is not provided.
            Maximum encoded size ~5MB. May include a data-URI prefix (e.g. `data:image/png;base64,...`).
        imageMediaType:
          type: string
          enum: [image/jpeg, image/png, image/gif, image/webp]
          default: image/jpeg
          description: >
            MIME type of the attached `image`. Required when `image` is provided; defaults to
            `image/jpeg` if `image` is present but this field is omitted.
        darkVersionMode:
          type: boolean
          default: false
          description: >
            Optional. When true, treats `primaryColours` as an existing light-theme palette and
            asks Claude to adapt surfaces and text for a dark theme while keeping the same hue families.
            Requires `primaryColours` (1–3 colours).

    AiBasePalette:
      type: object
      description: Twelve base colours returned by Bedrock; all other tokens are derived from these.
      required:
        - primary
        - primaryLight
        - primaryDark
        - secondary
        - accent
        - background
        - surface
        - textPrimary
        - success
        - error
        - warning
        - sidebar
      properties:
        primary: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', example: '#1D4ED8' }
        primaryLight: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        primaryDark: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        secondary: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        accent: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        background: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        surface: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        textPrimary: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        success: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Green family (hue 90–150°).' }
        error: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Red family.' }
        warning: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Amber family (hue 25–55°).' }
        sidebar: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: Drawer / nav background.' }

    AiGenerateThemeResponse:
      type: object
      required:
        - palette
        - tokens
        - fontFamilies
        - fontSizes
        - radiusPalette
        - radiusTokens
        - description
        - promptUsed
      properties:
        palette:
          $ref: '#/components/schemas/AiBasePalette'
        tokens:
          $ref: '#/components/schemas/ThemeTokenMap'
          description: Full derived token map (~312 keys) merged with defaults and fixed transparency tokens.
        fontFamilies:
          $ref: '#/components/schemas/ThemeFontFamilyMap'
          description: Default font families (AI does not change fonts in v1).
        fontSizes:
          $ref: '#/components/schemas/ThemeFontSizeMap'
          description: Default font sizes (AI does not change sizes in v1).
        radiusPalette:
          $ref: '#/components/schemas/ThemeRadiusPalette'
          description: Six semantic corner-radius values chosen by the model (or defaults).
        radiusTokens:
          $ref: '#/components/schemas/ThemeRadiusTokenMap'
          description: Full derived radius map (18 integer keys) from radiusPalette.
        description:
          type: string
          description: >-
            One-line summary from the model (after DESCRIPTION line in Bedrock output).
          example: Navy and gold aviation theme with high-contrast surfaces.
        promptUsed:
          type: string
          description: Trimmed prompt sent to Bedrock.

    ThemeTokenMap:
      type: object
      additionalProperties:
        type: string
      description: Map of design token key to hex color (#RRGGBB or #RRGGBBAA).

    ThemeFontFamilyMap:
      type: object
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 100
      description: >
        Font family overrides. Keys must be one of primary, secondary, mono (see server defaults).
        Values are non-empty font family names (max 100 characters).

    ThemeFontSizeMap:
      type: object
      additionalProperties:
        type: number
        minimum: 8
        maximum: 96
      description: >
        Font size overrides in logical pixels. Keys must match server-supported size slots
        (e.g. displayLarge, displaySmall, headlineSmall, titleMedium, labelSmall, buttonSmall, bodyMedium).
        Values must be between 8 and 96.

    ThemeFontTokens:
      type: object
      required: [families, sizes]
      properties:
        families:
          $ref: '#/components/schemas/ThemeFontFamilyMap'
        sizes:
          $ref: '#/components/schemas/ThemeFontSizeMap'
      description: >
        Fully resolved font tokens (default families and sizes merged with theme overrides).

    ThemeRadiusPaletteOverride:
      type: object
      description: >
        Semantic corner-radius overrides stored in DynamoDB (integers, dp/pt). Send only keys you
        want to set or change. On PUT, values are merged with existing overrides; unset keys keep
        prior values or fall back to defaults. Valid keys: radiusButton, radiusInput, radiusCard,
        radiusModal, radiusChip, radiusBottomSheet. After AI generate, copy `data.radiusPalette`
        into this field when saving the theme.
      additionalProperties: false
      properties:
        radiusButton: { type: integer, minimum: 0, example: 8 }
        radiusInput: { type: integer, minimum: 0, example: 8 }
        radiusCard: { type: integer, minimum: 0, example: 12 }
        radiusModal: { type: integer, minimum: 0, example: 16 }
        radiusChip: { type: integer, minimum: 0, example: 8 }
        radiusBottomSheet: { type: integer, minimum: 0, example: 24 }

    ThemeRadiusPalette:
      type: object
      required:
        - radiusButton
        - radiusInput
        - radiusCard
        - radiusModal
        - radiusChip
        - radiusBottomSheet
      properties:
        radiusButton: { type: integer, minimum: 0, example: 8 }
        radiusInput: { type: integer, minimum: 0, example: 8 }
        radiusCard: { type: integer, minimum: 0, example: 12 }
        radiusModal: { type: integer, minimum: 0, example: 16 }
        radiusChip: { type: integer, minimum: 0, example: 8 }
        radiusBottomSheet: { type: integer, minimum: 0, example: 24 }
      description: Fully resolved 6-key semantic radius palette (response only).

    ThemeRadiusTokenMap:
      type: object
      additionalProperties:
        type: integer
        minimum: 0
      description: Map of radius token key to integer (dp/pt). Includes 7 scale + 11 semantic keys (includes radiusIconButton for icon-only buttons).

    ThemeRadiusTokens:
      type: object
      required: [palette, tokens]
      properties:
        palette:
          $ref: '#/components/schemas/ThemeRadiusPalette'
        tokens:
          $ref: '#/components/schemas/ThemeRadiusTokenMap'
      description: >
        Fully resolved radius tokens (default palette merged with overrides, plus derived 18-key map).

    ThemeResponse:
      type: object
      required:
        - customerId
        - themeId
        - themeName
        - isActive
        - version
        - isDefault
        - createdAt
        - updatedAt
        - tokens
        - font_tokens
        - radius_tokens
      properties:
        customerId:
          type: string
          format: uuid
          description: Echoes the tenant id from the request path (UUID).
        themeId:
          type: string
          minLength: 1
          description: >
            Stored themes use a UUID. The public GET active-theme response may use the literal `default`
            when no theme row exists (synthetic default payload).
          pattern: '^(default|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
        themeName:
          type: string
        isActive:
          type: boolean
        version:
          type: integer
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        tokens:
          $ref: '#/components/schemas/ThemeTokenMap'
        font_tokens:
          $ref: '#/components/schemas/ThemeFontTokens'
        radius_tokens:
          $ref: '#/components/schemas/ThemeRadiusTokens'

    ThemeListItem:
      type: object
      required:
        - themeId
        - themeName
        - isActive
        - version
        - createdAt
        - updatedAt
        - overrideCount
      properties:
        themeId:
          type: string
        themeName:
          type: string
        isActive:
          type: boolean
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        overrideCount:
          type: integer
          description: Number of token keys overridden from the default theme.

    CreateThemeRequest:
      type: object
      required: [themeName]
      properties:
        themeName:
          type: string
          minLength: 1
          maxLength: 100
        tokens:
          $ref: '#/components/schemas/ThemeTokenMap'
        fontFamilies:
          $ref: '#/components/schemas/ThemeFontFamilyMap'
        fontSizes:
          $ref: '#/components/schemas/ThemeFontSizeMap'
        radiusPalette:
          $ref: '#/components/schemas/ThemeRadiusPaletteOverride'
      example:
        themeName: Corporate banking
        tokens:
          primary: '#1D4ED8'
        radiusPalette:
          radiusButton: 4
          radiusInput: 4
          radiusCard: 8
          radiusModal: 12
          radiusChip: 4
          radiusBottomSheet: 16

    UpdateThemeRequest:
      type: object
      properties:
        themeName:
          type: string
          minLength: 1
          maxLength: 100
        tokens:
          $ref: '#/components/schemas/ThemeTokenMap'
        fontFamilies:
          $ref: '#/components/schemas/ThemeFontFamilyMap'
        fontSizes:
          $ref: '#/components/schemas/ThemeFontSizeMap'
        radiusPalette:
          $ref: '#/components/schemas/ThemeRadiusPaletteOverride'
      example:
        radiusPalette:
          radiusButton: 8
          radiusCard: 12
          radiusBottomSheet: 24

    EmptyObject:
      type: object
      additionalProperties: false

    CartStatus:
      type: string
      enum: [active, expired, abandoned, converted]

    PassengerType:
      type: string
      enum: [adult, child, infant]

    AddonType:
      type: string
      enum: [seat, meal, baggage, trip_protect]

    FareInclusions:
      type: object
      required: [cabinBaggage, checkedBaggage, refundable, changeable, changeFee, meal, seat]
      properties:
        cabinBaggage:
          type: string
          example: 7kg
        checkedBaggage:
          type: string
          example: 23kg
        refundable:
          type: boolean
        changeable:
          type: boolean
        changeFee:
          type: number
          example: 0
        meal:
          type: boolean
        seat:
          type: string
          enum: [included, chargeable]

    Cart:
      type: object
      required:
        - cartId
        - userId
        - status
        - currency
        - passengerCount
        - totalAmount
        - createdAt
        - updatedAt
        - expiresAt
      properties:
        cartId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CartStatus'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: GBP
        passengerCount:
          type: integer
          minimum: 1
        totalAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: integer
          description: Epoch seconds — DynamoDB TTL attribute
          example: 1781246400

    CartLeg:
      type: object
      required:
        - cartId
        - legId
        - legOrder
        - flightId
        - origin
        - destination
        - departureAt
        - arrivalAt
        - fareClass
        - fareName
        - basePrice
        - fareInclusions
      properties:
        cartId:
          type: string
          format: uuid
        legId:
          type: string
          format: uuid
        legOrder:
          type: integer
          minimum: 0
          description: 0 = outbound, 1 = return
        flightId:
          type: string
        origin:
          type: string
        destination:
          type: string
        departureAt:
          type: string
          format: date-time
        arrivalAt:
          type: string
          format: date-time
        fareClass:
          type: string
        fareName:
          type: string
        basePrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
        fareInclusions:
          $ref: '#/components/schemas/FareInclusions'

    CartPassenger:
      type: object
      required:
        - cartId
        - passengerId
        - passengerIndex
        - passengerType
        - title
        - firstName
        - lastName
        - dob
        - nationality
        - passportNo
      properties:
        cartId:
          type: string
          format: uuid
        passengerId:
          type: string
          format: uuid
        passengerIndex:
          type: integer
          minimum: 0
        passengerType:
          $ref: '#/components/schemas/PassengerType'
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        nationality:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2
        passportNo:
          type: string

    SeatAddonDetails:
      type: object
      required: [seatNumber, seatType, category]
      properties:
        seatNumber:
          type: string
          example: 4D
        seatType:
          type: string
          example: window
        category:
          type: string
          example: XL

    MealAddonDetails:
      type: object
      required: [mealCode, mealName]
      properties:
        mealCode:
          type: string
          example: VGML
        mealName:
          type: string
          example: Vegetarian Meal

    BaggageAddonDetails:
      type: object
      required: [weightKg, pieces, baggageType]
      properties:
        weightKg:
          type: number
        pieces:
          type: integer
          minimum: 1
        baggageType:
          type: string
          enum: [checked, cabin]

    TripProtectAddonDetails:
      type: object
      required: [planName, coverageAmount, coverageCurrency]
      properties:
        planName:
          type: string
        coverageAmount:
          type: number
        coverageCurrency:
          type: string

    AddonDetails:
      oneOf:
        - $ref: '#/components/schemas/SeatAddonDetails'
        - $ref: '#/components/schemas/MealAddonDetails'
        - $ref: '#/components/schemas/BaggageAddonDetails'
        - $ref: '#/components/schemas/TripProtectAddonDetails'

    CartAddon:
      type: object
      required: [cartId, addonId, type, passengerId, legId, price, currency, addedAt, details]
      properties:
        cartId:
          type: string
          format: uuid
        addonId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/AddonType'
        passengerId:
          type: string
          format: uuid
          nullable: true
          description: Null for trip_protect
        legId:
          type: string
          format: uuid
          nullable: true
          description: Null for trip_protect
        price:
          type: number
        currency:
          type: string
        addedAt:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/AddonDetails'

    CreateCartLegRequest:
      type: object
      required:
        - flightId
        - legOrder
        - fareClass
        - fareName
        - basePrice
        - departureAt
        - arrivalAt
        - fareInclusions
      properties:
        flightId:
          type: string
        legOrder:
          type: integer
          minimum: 0
        fareClass:
          type: string
        fareName:
          type: string
        basePrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
        departureAt:
          type: string
          format: date-time
        arrivalAt:
          type: string
          format: date-time
        fareInclusions:
          $ref: '#/components/schemas/FareInclusions'

    CreateCartPassengerRequest:
      type: object
      required:
        - passengerIndex
        - passengerType
        - title
        - firstName
        - lastName
        - dob
        - nationality
        - passportNo
      properties:
        passengerIndex:
          type: integer
          minimum: 0
        passengerType:
          $ref: '#/components/schemas/PassengerType'
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        nationality:
          type: string
          minLength: 2
          maxLength: 2
        passportNo:
          type: string

    CreateCartRequest:
      type: object
      required: [currency, legs, passengers]
      properties:
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        legs:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: '#/components/schemas/CreateCartLegRequest'
        passengers:
          type: array
          minItems: 1
          maxItems: 9
          items:
            $ref: '#/components/schemas/CreateCartPassengerRequest'

    CartDetailResponseData:
      type: object
      required: [cart, legs, passengers, addons]
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        legs:
          type: array
          items:
            $ref: '#/components/schemas/CartLeg'
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/CartPassenger'
        addons:
          type: array
          items:
            $ref: '#/components/schemas/CartAddon'

    CartListItem:
      type: object
      required:
        - cartId
        - status
        - currency
        - totalAmount
        - passengerCount
        - legCount
        - createdAt
        - expiresAt
        - legs
      properties:
        cartId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CartStatus'
        currency:
          type: string
        totalAmount:
          type: number
        passengerCount:
          type: integer
        legCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: integer
          description: Epoch seconds
        legs:
          type: array
          items:
            type: object
            required: [origin, destination, departureAt, legOrder]
            properties:
              origin:
                type: string
              destination:
                type: string
              departureAt:
                type: string
                format: date-time
              legOrder:
                type: integer

    ReplaceLegRequest:
      type: object
      required:
        - flightId
        - fareClass
        - fareName
        - basePrice
        - departureAt
        - arrivalAt
        - fareInclusions
      properties:
        flightId:
          type: string
        fareClass:
          type: string
        fareName:
          type: string
        basePrice:
          type: number
          minimum: 0
          exclusiveMinimum: true
        departureAt:
          type: string
          format: date-time
        arrivalAt:
          type: string
          format: date-time
        fareInclusions:
          $ref: '#/components/schemas/FareInclusions'

    RemoveLegResultData:
      type: object
      required: [updatedLeg, deletedAddons]
      properties:
        updatedLeg:
          $ref: '#/components/schemas/CartLeg'
        deletedAddons:
          type: array
          items:
            $ref: '#/components/schemas/CartAddon'

    AddPassengerRequest:
      type: object
      required:
        - passengerType
        - title
        - firstName
        - lastName
        - dob
        - nationality
        - passportNo
      properties:
        passengerType:
          $ref: '#/components/schemas/PassengerType'
        title:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        dob:
          type: string
          format: date
        nationality:
          type: string
          minLength: 2
          maxLength: 2
        passportNo:
          type: string

    RemovePassengerResultData:
      type: object
      required: [deletedPassengerId, deletedAddons]
      properties:
        deletedPassengerId:
          type: string
          format: uuid
        deletedAddons:
          type: array
          items:
            $ref: '#/components/schemas/CartAddon'

    AddAddonRequest:
      type: object
      required: [type, price, currency, details]
      properties:
        type:
          $ref: '#/components/schemas/AddonType'
        passengerId:
          type: string
          format: uuid
          description: Required for seat, meal, baggage; omit for trip_protect
        legId:
          type: string
          format: uuid
          description: Required for seat, meal, baggage; omit for trip_protect
        price:
          type: number
        currency:
          type: string
        details:
          $ref: '#/components/schemas/AddonDetails'
