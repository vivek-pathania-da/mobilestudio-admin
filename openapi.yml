      properties:
        category:
          $ref: '#/components/schemas/BookingSeatCategory'
        seatType:
          type: string
          enum: [window, middle, aisle]
        price:
          type: number
          minimum: 0

    BookingBaggageAddonSelection:
      type: object
      required: [extraType, price]
      properties:
        extraType:
          type: string
          example: extra_bag_10kg
        label:
          type: string
          example: '+10 kg'
        weightKg:
          type: number
        pieces:
          type: number
        price:
          type: number
          minimum: 0

    BookingMealAddonSelection:
      type: object
      required: [meal, price]
      properties:
        meal:
          $ref: '#/components/schemas/BookingMealType'
        mealCode:
          type: string
          example: VGML
        mealName:
          type: string
          example: Vegetarian Meal
        price:
          type: number
          minimum: 0

    BookingTripProtection:
      type: object
      required: [planId, planName, price]
      description: Booking-level trip protection (one per booking).
      properties:
        planId:
          type: string
          example: trip_protection_basic
        planName:
          type: string
          example: Trip Protection
        price:
          type: number
          minimum: 0
        coverageAmount:
          type: number
        coverageCurrency:
          type: string

    BookingFareBreakdown:
      type: object
      required:
        - baseFare
        - taxes
        - seatsTotal
        - baggageTotal
        - mealsTotal
        - tripProtectionTotal
        - otherAddonsTotal
        - addonsTotal
        - total
      properties:
        baseFare:
          type: number
        taxes:
          type: number
        seatsTotal:
          type: number
          description: Sum of paid seat fees across all passengers and legs
        baggageTotal:
          type: number
        mealsTotal:
          type: number
        tripProtectionTotal:
          type: number
        otherAddonsTotal:
          type: number
          description: Priority boarding, lounge access, etc.
        addonsTotal:
          type: number
          description: seatsTotal + baggageTotal + mealsTotal + tripProtectionTotal + otherAddonsTotal
        total:
          type: number

    BookingPassengerFare:
      type: object
      required: [baseFare, taxes, seatPrice, addonsTotal, total]
      properties:
        baseFare:
          type: number
        taxes:
          type: number
        seatPrice:
          type: number
        addonsTotal:
          type: number
          description: Non-seat add-ons for this passenger on this leg
        total:
          type: number

    BookingSpecialAssistance:
      type: object
      required:
        - wheelchairRequired
        - visualImpairment
        - hearingImpairment
        - oxygenRequired
        - stretcherRequired
        - notes
      properties:
        wheelchairRequired:
          type: boolean
        visualImpairment:
          type: boolean
        hearingImpairment:
          type: boolean
        oxygenRequired:
          type: boolean
        stretcherRequired:
          type: boolean
        notes:
          type: string

    BookingPassengerAddons:
      type: object
      description: >
        Per-passenger per-leg add-ons with explicit prices from addons catalog / seatmap.
        Legacy `extraBaggage` / `meal` enums still supported with fixed fallback pricing.
      properties:
        extraBaggage:
          $ref: '#/components/schemas/BookingExtraBaggage'
        meal:
          $ref: '#/components/schemas/BookingMealType'
        priorityBoarding:
          type: boolean
        loungeAccess:
          type: boolean
        priorityBoardingPrice:
          type: number
        loungeAccessPrice:
          type: number
        baggage:
          $ref: '#/components/schemas/BookingBaggageAddonSelection'
        mealSelection:
          $ref: '#/components/schemas/BookingMealAddonSelection'

    BoardingPass:
      type: object
      required:
        - boardingGroup
        - gate
        - boardingTime
        - seat
        - barcode
        - s3Key
        - checkInPageUrl
        - issuedAt
      properties:
        boardingGroup:
          type: string
          enum: [A, B, C, D]
        gate:
          type: string
          example: B44
        boardingTime:
          type: string
          format: date-time
        seat:
          type: string
          example: 14A
        barcode:
          type: string
          description: >
            Unique per passenger per leg. Format `BP` + bookingReference + legOrder +
            first 6 chars of passengerId (uppercase, no hyphens).
        s3Key:
          type: string
          example: boarding-passes/{bookingId}/{passengerId}/leg-0.pdf
        checkInPageUrl:
          type: string
          format: uri
        issuedAt:
          type: string
          format: date-time
        pdfUrl:
          type: string
          format: uri
          description: Pre-signed S3 URL (24-hour expiry)

    BookingCancellationInfo:
      type: object
      required: [cancelledAt, refundAmount, refundStatus]
      properties:
        cancelledAt:
          type: string
          format: date-time
        reason:
          type: string
        refundAmount:
          type: number
        refundStatus:
          type: string
          enum: [pending, processed]

    BookingChangeHistoryEntry:
      type: object
      required: [changedAt, legId, legOrder, oldFlightId, newFlightId, fareDifference]
      properties:
        changedAt:
          type: string
          format: date-time
        legId:
          type: string
          format: uuid
        legOrder:
          type: integer
          minimum: 0
        oldFlightId:
          type: string
          format: uuid
        newFlightId:
          type: string
          format: uuid
        fareDifference:
          type: number
        reason:
          type: string

    BookingLeg:
      type: object
      required: [legId, legOrder, flight, passengerCount]
      properties:
        legId:
          type: string
          format: uuid
        legOrder:
          type: integer
          minimum: 0
          description: Zero-based leg order (0=outbound, 1=connecting, etc.)
        flight:
          $ref: '#/components/schemas/BookingFlightSnapshot'
        passengerCount:
          type: integer
          minimum: 1

    PassengerLegAssignment:
      type: object
      required: [legId, legOrder, seatNumber, addons, passengerFare]
      properties:
        legId:
          type: string
          format: uuid
        legOrder:
          type: integer
          minimum: 0
        seatNumber:
          type: string
          example: 14A
        seatSelection:
          $ref: '#/components/schemas/BookingSeatSelection'
        addons:
          $ref: '#/components/schemas/BookingPassengerAddons'
        passengerFare:
          $ref: '#/components/schemas/BookingPassengerFare'
        boardingPass:
          $ref: '#/components/schemas/BoardingPass'

    BookingRecord:
      type: object
      required:
        - bookingId
        - bookingReference
        - userId
        - legs
        - cabinClass
        - status
        - checkInStatus
        - boardingPassIssued
        - contactEmail
        - contactPhone
        - totalAmount
        - currency
        - fareBreakdown
        - paymentStatus
        - changeHistory
        - passengerCount
        - legCount
        - createdAt
        - updatedAt
      properties:
        bookingId:
          type: string
          format: uuid
        bookingReference:
          type: string
          pattern: '^[A-Z0-9]{6}$'
          example: EK8X3F
        userId:
          type: string
          format: uuid
        legs:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/BookingLeg'
        cabinClass:
          type: integer
          enum: [1, 2, 3, 4]
          description: 1=economy, 2=premium_economy, 3=business, 4=first
        status:
          $ref: '#/components/schemas/BookingStatus'
        checkInStatus:
          $ref: '#/components/schemas/CheckInStatus'
        boardingPassIssued:
          type: boolean
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        totalAmount:
          type: number
        currency:
          type: string
        fareBreakdown:
          $ref: '#/components/schemas/BookingFareBreakdown'
        tripProtection:
          $ref: '#/components/schemas/BookingTripProtection'
        paymentStatus:
          $ref: '#/components/schemas/BookingPaymentStatus'
        cancellationInfo:
          $ref: '#/components/schemas/BookingCancellationInfo'
        changeHistory:
          type: array
          items:
            $ref: '#/components/schemas/BookingChangeHistoryEntry'
        passengerCount:
          type: integer
          minimum: 1
        legCount:
          type: integer
          minimum: 1
          maximum: 4
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookingPassenger:
      type: object
      required:
        - bookingId
        - passengerId
        - type
        - title
        - firstName
        - lastName
        - dateOfBirth
        - nationality
        - passportNumber
        - passportExpiry
        - specialAssistance
        - legs
        - createdAt
        - updatedAt
      properties:
        bookingId:
          type: string
          format: uuid
        passengerId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/PassengerType'
        title:
          $ref: '#/components/schemas/BookingPassengerTitle'
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        nationality:
          type: string
          minLength: 2
          maxLength: 2
        passportNumber:
          type: string
        passportExpiry:
          type: string
          format: date
        frequentFlyerNumber:
          type: string
        specialAssistance:
          $ref: '#/components/schemas/BookingSpecialAssistance'
        legs:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/PassengerLegAssignment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookingWithPassengers:
      allOf:
        - $ref: '#/components/schemas/BookingRecord'
        - type: object
          required: [passengers]
          properties:
            passengers:
              type: array
              items:
                $ref: '#/components/schemas/BookingPassenger'

    BookingListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/BookingRecord'

    PassengerLegRequest:
      type: object
      required: [legOrder, seatNumber]
      properties:
        legOrder:
          type: integer
          minimum: 0
          description: Zero-based index matching the booking legs array
        seatNumber:
          type: string
          example: 14A
        seatSelection:
          $ref: '#/components/schemas/BookingSeatSelection'
        addons:
          $ref: '#/components/schemas/BookingPassengerAddons'

    CreateBookingPassengerRequest:
      type: object
      required:
        - type
        - title
        - firstName
        - lastName
        - dateOfBirth
        - nationality
        - passportNumber
        - passportExpiry
        - legs
      properties:
        type:
          $ref: '#/components/schemas/PassengerType'
        title:
          $ref: '#/components/schemas/BookingPassengerTitle'
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        nationality:
          type: string
          minLength: 2
          maxLength: 2
        passportNumber:
          type: string
        passportExpiry:
          type: string
          format: date
        frequentFlyerNumber:
          type: string
        specialAssistance:
          $ref: '#/components/schemas/BookingSpecialAssistance'
        legs:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/PassengerLegRequest'

    BookingLegSegmentInput:
      type: object
      description: >
        Per-leg route and local times for a connecting segment. Copy from search `segments[]`
        when booking a multi-stop card. When omitted, airports and times come from the offer
        referenced by `flightId` (correct when each leg uses its own segment offer UUID).
      required:
        - fromAirportCode
        - toAirportCode
        - departureTimeLocal
        - arrivalTimeLocal
      properties:
        fromAirportCode:
          type: string
          example: BLR
        toAirportCode:
          type: string
          example: MAA
        fromAirportName:
          type: string
          example: Bengaluru
        toAirportName:
          type: string
          example: Chennai
        departureTimeLocal:
          type: string
          example: "07:00"
        arrivalTimeLocal:
          type: string
          example: "08:30"

    BookingLegRequest:
      type: object
      required: [flightId, fareClassCode, departureDate]
      properties:
        flightId:
          type: string
          format: uuid
          description: >
            Per-segment offer UUID. For connecting cards use `segmentFlightIds[i]` from search,
            not the parent connecting card id on every leg.
        fareClassCode:
          type: string
        departureDate:
          type: string
          format: date
          description: >
            Travel date from flight search (YYYY-MM-DD). Departure and arrival times on the
            booking snapshot are built from this date plus `segment` local times or the offer's
            local times — not the stale `departureEpoch` stored in FlightOffers.
        segment:
          $ref: '#/components/schemas/BookingLegSegmentInput'

    CreateBookingRequest:
      type: object
      description: >
        Each passenger `legs` array must contain exactly one entry per booking leg (matching `legOrder` 0..n-1).
        Seat numbers must be unique per leg across all passengers. Each booking leg must include `departureDate`
        (the date the user searched for) so snapshot times are correct with mock flight data. For connecting
        flights, each booking leg should use a distinct segment `flightId` and include `segment` with that
        leg's airports and times from search `segments[]`.
      required:
        - legs
        - cabinClass
        - contactEmail
        - contactPhone
        - passengers
      properties:
        legs:
          type: array
          minItems: 1
          maxItems: 4
          description: Flight legs in travel order (outbound, connecting, return).
          items:
            $ref: '#/components/schemas/BookingLegRequest'
        cabinClass:
          type: integer
          enum: [1, 2, 3, 4]
          description: Applies to the entire booking (not per leg). 1=economy, 2=premium_economy, 3=business, 4=first
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        passengers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateBookingPassengerRequest'
        tripProtection:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BookingTripProtection'
          description: Optional booking-level trip protection from addons catalog.

    UpdateBookingPassengerRequest:
      type: object
      properties:
        specialAssistance:
          $ref: '#/components/schemas/BookingSpecialAssistance'
        frequentFlyerNumber:
          type: string
        passportNumber:
          type: string
        passportExpiry:
          type: string
          format: date

    UpdateBookingSeatRequest:
      type: object
      required: [legId, seatNumber]
      properties:
        legId:
          type: string
          format: uuid
        seatNumber:
          type: string
          example: 22F
        seatSelection:
          $ref: '#/components/schemas/BookingSeatSelection'

    UpdateBookingAddonsRequest:
      type: object
      description: >
        At least one add-on field must be present. Prefer `baggage` / `mealSelection` with explicit
        prices from the addons catalog. Set nullable fields to `null` to remove.
      required: [legId]
      properties:
        legId:
          type: string
          format: uuid
        extraBaggage:
          description: Set to `null` to remove this add-on.
          type: string
          nullable: true
          enum: ['15kg', '23kg', '32kg']
        meal:
          description: Set to `null` to remove this add-on.
          type: string
          nullable: true
          enum: [standard, vegetarian, vegan, halal, kosher, child_meal]
        priorityBoarding:
          type: boolean
        loungeAccess:
          type: boolean
        priorityBoardingPrice:
          type: number
        loungeAccessPrice:
          type: number
        baggage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BookingBaggageAddonSelection'
        mealSelection:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/BookingMealAddonSelection'

    UpdateBookingAddonsResult:
      type: object
      required: [passenger, bookingTotal]
      properties:
        passenger:
          $ref: '#/components/schemas/BookingPassenger'
        bookingTotal:
          type: number

    ChangeBookingFlightRequest:
      type: object
      required: [legId, newFlightId]
      properties:
        legId:
          type: string
          format: uuid
        newFlightId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500

    ChangeBookingFlightResult:
      allOf:
        - $ref: '#/components/schemas/BookingWithPassengers'
        - type: object
          required: [fareDifference]
          properties:
            fareDifference:
              type: number

    BoardingPassesResult:
      type: object
      required: [passengers]
      properties:
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/BookingPassenger'

    CheckInNotOpenError:
      type: object
      required: [success, message, hoursUntilOpen]
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Check-in is not yet open. Opens in 12 hours.
        hoursUntilOpen:
          type: integer
          minimum: 1
          description: Hours until the 48-hour check-in window opens (based on earliest leg departure)
