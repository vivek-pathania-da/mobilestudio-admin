          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BookingPassenger'
        '400':
          $ref: '#/components/responses/BookingValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          description: Booking or passenger not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/bookings/{bookingId}/passengers/{passengerId}/seat:
    patch:
      summary: Change passenger seat on one leg
      description: >
        Updates `seatNumber` for the passenger on the leg identified by `legId`.
        Duplicate seats on the same leg across passengers are rejected.
        If a boarding pass exists on that leg assignment, its `seat` field is updated too.
      tags: [Bookings]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
